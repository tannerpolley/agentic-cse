[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-companion"
version = "1.0.0"
description = "Source-linked research synthesis and scientific data companion for Zotero"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "linkml>=1.9,<2",
]

[project.scripts]
zotero-companion = "zotero_companion.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
