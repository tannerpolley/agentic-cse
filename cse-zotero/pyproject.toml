[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-wiki"
version = "0.1.0"
description = "Read-only Zotero inventory, agent wiki materialization, and staged automation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zotero-wiki = "zotero_wiki.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
